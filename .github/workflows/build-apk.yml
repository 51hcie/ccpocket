name: Build Android APK
on:
  push:
    branches:
      - build-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;29.0.13846066"
      - name: Setup Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANYCODING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANYCODING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANYCODING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANYCODING_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing required signing secrets (ANYCODING_KEYSTORE_BASE64, ANYCODING_KEYSTORE_PASSWORD, ANYCODING_KEY_PASSWORD, ANYCODING_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore.jks
          cat > apps/mobile/android/keystore.properties << EOF
          storeFile=${{ github.workspace }}/apps/mobile/android/keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "=== Stable Keystore Certificate Fingerprint ==="
          keytool -list -v -keystore apps/mobile/android/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name:|Owner:|Issuer:|SHA1:|SHA256:"
      - name: Use precompiled Rust artifacts for Shorebird
        run: |
          printf '%s\n' 'use_precompiled_binaries: true' > apps/mobile/cargokit_options.yaml
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Run test suite
        working-directory: apps/mobile
        run: flutter test --dart-define=ANYCODING_BRAND=true
      - name: Build Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=MACREMOTE_BRIDGE_URL=ws://[2408:824e:158d:5a80:875:122:45bf:5441]:8766 --dart-define=MACREMOTE_BRIDGE_NAME="AnyCoding Mac" --dart-define=MACREMOTE_AUTO_CONNECT=true --dart-define=ANYCODING_BRAND=true
      - name: Verify APK Signature Fingerprint
        working-directory: apps/mobile
        run: |
          echo "=== Built APK Signature Fingerprint ==="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk | grep -E "Owner:|Issuer:|SHA1:|SHA256:"
          APK_SHA256=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk | grep "SHA256:" | tr -d ' :' | tr '[:upper:]' '[:lower:]' | sed 's/sha256//')
          EXPECTED_SHA256="59186b6981215494ee6e21e8a988dc7a434eb7ffa40bfc226e9dbdbc585cb2d2"
          echo "APK Certificate SHA256: $APK_SHA256"
          echo "Expected SHA256:       $EXPECTED_SHA256"
          if [ "$APK_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK certificate SHA256 mismatch! Got $APK_SHA256, expected $EXPECTED_SHA256"
            exit 1
          fi
          echo "APK signature successfully verified with stable key!"
      - name: Prepare AnyCoding APK
        working-directory: apps/mobile
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/anycoding.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anycoding-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/anycoding.apk
