name: Build Android APK
on:
  push:
    branches:
      - build-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;29.0.13846066"
      - name: Use precompiled Rust artifacts for Shorebird
        run: |
          printf '%s\n' 'use_precompiled_binaries: true' > apps/mobile/cargokit_options.yaml
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Run IPv6, Home Dashboard Status & Macremote Bootstrap Tests
        working-directory: apps/mobile
        run: flutter test test/connection_url_parser_test.dart test/machine_manager_ipv6_test.dart test/network_endpoint_test.dart test/dashboard_metrics_test.dart test/dual_engine_dashboard_card_test.dart test/macremote_bootstrap_test.dart test/brand_config_test.dart test/task_status_classifier_test.dart test/anycoding_navigation_test.dart test/anycoding_projects_tab_test.dart test/anycoding_new_task_sheet_test.dart test/anycoding_advanced_options_test.dart test/anycoding_screen_overflow_test.dart
      - name: Build Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=MACREMOTE_BRIDGE_URL=ws://[2408:824e:158d:5a80:875:122:45bf:5441]:8766 --dart-define=MACREMOTE_BRIDGE_NAME="AnyCoding Mac" --dart-define=MACREMOTE_AUTO_CONNECT=true --dart-define=ANYCODING_BRAND=true
      - name: Prepare AnyCoding APK
        working-directory: apps/mobile
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/anycoding.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anycoding-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/anycoding.apk
